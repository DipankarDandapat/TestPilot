services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: api_test_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app
    env_file:
      - backend/.env
    environment:
      - CORS_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=http://localhost:8000
    container_name: api_test_frontend
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
